name: ci

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # unit + component + vitest-axe on every screen + type tests
      - run: pnpm test
      - run: pnpm tokens:contrast
      - run: pnpm build
      - run: pnpm check:bundle

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # compose builds ../legal-frontend, so both repos sit side by side
      - uses: actions/checkout@v4
        with: { path: legal-frontend }
      - uses: actions/checkout@v4
        with: { repository: GajapathiRaoAmpera/legal-backend, path: legal-backend }
      - name: Start the core stack (LLM_MODE=fake)
        working-directory: legal-backend
        run: docker compose --profile core up -d --build --wait --wait-timeout 600
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - working-directory: legal-frontend
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      - working-directory: legal-frontend
        env: { E2E_BASE_URL: "http://localhost:8080" }
        run: pnpm test:e2e
      - if: failure()
        working-directory: legal-backend
        run: docker compose --profile core logs --no-color --tail 300
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: legal-frontend/playwright-report
          retention-days: 7
